[project]
name = "agent-tts"
version = "0.2.0"
description = "Speak agent responses aloud on macOS, Windows, and Linux (Claude Code, Cursor, Antigravity), with optional cloud voices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []  # runtime is Python stdlib only

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
